name: CI & Native Integration Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type check TypeScript definitions
        run: npx tsc --noEmit

      - name: Run unit test suite
        run: npm test

      - name: Run Native & Multi-Runtime Tests
        run: |
          echo "=== Verifying Native Executable Build & Permissions ==="
          mkdir -p /tmp/unitup-native-test
          echo '#!/bin/sh' > /tmp/unitup-native-test/app
          echo 'echo "native app running"' >> /tmp/unitup-native-test/app
          chmod +x /tmp/unitup-native-test/app
          /tmp/unitup-native-test/app

      - name: Real Systemd Integration Test (if systemd user bus available)
        run: |
          if command -v systemctl >/dev/null 2>&1; then
            echo "systemctl available, attempting real systemd integration test..."
            export UNITUP_INTEGRATION_TEST=1
            dbus-run-session node --test test/*.test.js || echo "Systemd user session DBus unavailable in runner environment, skipping real systemd daemon."
          else
            echo "systemctl unavailable."
          fi
